<!DOCTYPE html>
<html lang="pt-br" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jornal</title>
    <!-- Carrega o Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full">
    
    <!-- Barra de Navegação -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="{% url 'home' %}" class="text-2xl font-bold text-indigo-600">
                           MeuJornal
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    {% if user.is_authenticated %}
                        <!-- Links para usuário logado -->
                        <a href="{% url 'pagina_de_interesses' %}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Interesses</a>
                        <a href="{% url 'routine' %}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Rotina</a>
                        
                        <form action="{% url 'logout' %}" method="post" class="ml-4">
                            {% csrf_token %}
                            <button type_submit" class="px-3 py-2 rounded-md text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100">
                                Sair ({{ user.username }})
                            </button>
                        </form>
                    {% else %}
                        <!-- Links para usuário deslogado -->
                        <a href="{% url 'login' %}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">
                            Entrar
                        </a>
                        <a href="{% url 'registro' %}" class="ml-4 px-3 py-2 rounded-md text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                            Cadastrar
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal da Página -->
    <main class="py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- Bloco de Mensagens (para "Conta criada com sucesso!") -->
            {% if messages %}
                <div class="mb-6 max-w-lg mx-auto">
                    {% for message in messages %}
                        <div class="{% if message.tags == 'success' %} bg-green-100 border-green-400 text-green-700 {% else %} bg-red-100 border-red-400 text-red-700 {% endif %} border px-4 py-3 rounded-lg relative" role="alert">
                            <span class="block sm:inline">{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- O conteúdo de 'login.html' ou 'registro.html' será inserido aqui -->
            {% block content %}
            {% endblock content %}
        </div>
    </main>

</body>
</html>
