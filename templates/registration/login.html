<!--
Este template é o formulário de Login de usuário.
Ele usa a variável 'form' enviada pelo sistema de autenticação do Django.
-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Usuário</title>
    <!-- Inclui o Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos adicionais para centralizar e melhorar a leitura */
        body { font-family: 'Inter', sans-serif; background-color: #f7fafc; }
        
        /* Ajuste do estilo para os campos de formulário gerados pelo Django */
        .form-container p { margin-bottom: 1rem; }
        .form-container label { display: block; font-weight: 600; color: #4a5568; margin-bottom: 0.25rem; }
        .form-container input[type="text"],
        .form-container input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem; /* rounded-lg */
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            margin-top: 0.25rem;
        }
        .form-container input[type="text"]:focus,
        .form-container input[type="password"]:focus {
            border-color: #4c51bf; /* indigo-600 */
            box-shadow: 0 0 0 3px rgba(76, 81, 191, 0.5);
            outline: none;
        }
        /* Estilo para erros de validação */
        .form-container ul.errorlist {
            list-style: none;
            padding: 0;
            margin-top: 0.5rem;
            color: #e53e3e; /* red-600 */
            font-size: 0.875rem;
            font-weight: 500;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border border-gray-100">
        
        <!-- Título -->
        <h1 class="text-3xl font-extrabold text-gray-800 mb-6 text-center border-b pb-3">
            Acesso à Conta
        </h1>

        <!-- Tratamento de Erros de Login (se houver) -->
        {% if form.errors %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                <strong class="font-bold">Erro de Login!</strong>
                <span class="block sm:inline">Nome de usuário ou senha inválidos.</span>
            </div>
        {% endif %}
        
        <!-- Formulário de Login -->
        <!-- O action aponta para a URL de login (que está em /accounts/login/) -->
        <form method="post" action="{% url 'login' %}" class="space-y-6 form-container">
            {% csrf_token %}
            
            <!-- Renderiza os campos do formulário (username e password) -->
            {{ form.as_p }}

            <!-- Campo Hidden para Redirecionamento (importante para segurança) -->
            <input type="hidden" name="next" value="{{ next }}" />

            <!-- Botão de Submissão -->
            <button type="submit"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-300 transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50"
            >
                Entrar
            </button>
        </form>

        <!-- Links Auxiliares -->
        <div class="mt-6 text-center border-t pt-4 space-y-3">
            <p class="text-sm text-gray-600">
                <a href="{% url 'password_reset' %}" class="text-indigo-600 hover:text-indigo-800 font-medium transition duration-150">
                    Esqueceu sua senha?
                </a>
            </p>
            <p class="text-sm text-gray-600">
                Ainda não tem conta? 
                <!-- Aponta corretamente para a URL 'registro' -->
                <a href="{% url 'registro' %}" class="text-indigo-600 hover:text-indigo-800 font-medium transition duration-150">
                    Cadastre-se aqui
                </a>
            </p>
        </div>
        
    </div>
</body>
</html>
