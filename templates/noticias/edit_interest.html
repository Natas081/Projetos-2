{% extends "noticias/base.html" %}

{% block page_title %}Editar Interesse{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-100">

    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">✏️ Editar Interesse</h1>

    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-4">
            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                Nome do Interesse
            </label>
            <input type="text" name="name" id="name" 
                   value="{{ interest.name }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
                   required>
        </div>

        <div class="mb-6">
            <label for="target_frequency" class="block text-sm font-medium text-gray-700 mb-2">
                Meta de Leituras (Semana Atual)
            </label>
            <input type="number" name="target_frequency" id="target_frequency" 
                   value="{{ goal.targetFrequency|default:0 }}"
                   min="0"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500">
            <p class="text-xs text-gray-500 mt-1">Defina 0 para remover a meta desta semana.</p>
        </div>

        <div class="flex justify-between items-center">
            <a href="{% url 'routine' %}" class="text-sm font-medium text-gray-600 hover:text-red-600">
                Cancelar
            </a>
            <button type="submit" 
                    class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-lg font-medium transition">
                Salvar Alterações
            </button>
        </div>
    </form>

</div>
{% endblock %}
