{% extends "noticias/base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Acesso à Conta</h1>

    {% if form.errors %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <strong>Erro:</strong> Usuário ou senha incorretos.
        </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="space-y-5">
        {% csrf_token %}
        
        <!-- Campo de Usuário -->
        <div>
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
            <input type="text" name="username" id="id_username" required
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                   placeholder="Digite seu usuário">
        </div>

        <!-- Campo de Senha -->
        <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <input type="password" name="password" id="id_password" required
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                   placeholder="Digite sua senha">
        </div>

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition">
            Entrar
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
            Não tem conta?
            <a href="{% url 'registro' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
