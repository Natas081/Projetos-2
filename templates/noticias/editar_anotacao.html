{% extends 'noticias/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">

    <h1 class="text-2xl font-bold mb-4 text-indigo-700 text-center">
        ✏️ Editar Anotação
    </h1>

    <form method="post">
        {% csrf_token %}
        <textarea name="texto" rows="6" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-400">{{ anotacao.texto }}</textarea>

        <div class="flex justify-between mt-4">
            <a href="{% url 'diario' %}" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg transition">Cancelar</a>
            <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">Salvar Alterações</button>
        </div>
    </form>

</div>
{% endblock %}
