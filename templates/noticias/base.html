<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto ReadME</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background-color: #f8f9fa; 
        }
        /* Ajusta o 'main-container' para ficar abaixo do novo menu */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh; /* Reduzido um pouco para dar espaço ao menu */
            padding-top: 20px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        
        <a class="navbar-brand" href="{% url 'home' %}">
            <strong>MeuJornal</strong>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}"><i class="bi bi-fire"></i> Streak</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'pagina_de_interesses' %}"><i class="bi bi-bookmark-star"></i> Interesses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'routine' %}"><i class="bi bi-calendar-check"></i> Rotina</a>
                </li>
            </ul>
            
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-danger" href="/admin/logout/">
                        <i class="bi bi-box-arrow-right"></i> Sair ({{ user.username }})
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="card shadow-sm" style="width: 100%; max-width: 600px;">
        <div class="card-body p-4 p-md-5">
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert 
                        {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %}
                        alert-dismissible fade show text-center" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}
            {% endblock %}
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
