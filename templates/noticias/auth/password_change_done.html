{% extends "noticias/base.html" %}

{% block page_title %}Senha Alterada{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">

  <h1 class="text-3xl font-extrabold text-gray-900 mb-8">Alterar Senha</h1>

  <div class="max-w-lg">
    <section class="rounded-2xl overflow-hidden shadow-xl border border-red-200">
      
      <!-- Cabeçalho Vermelho -->
      <div class="bg-gradient-to-br from-red-600 to-red-500 px-6 py-4">
        <h2 class="text-white text-xl font-bold">Conta</h2>
        <p class="text-white/80 text-sm">Gerencie seu usuário e senha</p>
      </div>

      <!-- Corpo -->
      <div class="bg-white p-8 text-center">
        <div class="flex flex-col items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-green-500 mb-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414L9 14.414l-3.707-3.707a1 1 0 011.414-1.414L9 11.586l6.293-6.293a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>

          <h3 class="text-xl font-semibold text-gray-800 mb-2">Senha alterada com sucesso!</h3>
          <p class="text-gray-600 mb-6">Sua senha foi atualizada corretamente.</p>

          <a href="{% url 'settings' %}"
             class="inline-block px-5 py-2 rounded-md bg-red-600 hover:bg-red-700 text-white font-semibold">
            Voltar às configurações
          </a>
        </div>
      </div>
    </section>
  </div>

</div>
{% endblock %}
