# Nome do nosso fluxo de trabalho
name: CI/CD MeuJornal

# Define quando este fluxo de trabalho deve ser acionado
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # =======================================================
  # JOB 1: BUILD E TESTE
  # =======================================================
  build:
    name: Build e Teste
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o seu código
      - name: Clonar repositório
        uses: actions/checkout@v3

      # 2. Configura o ambiente Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # (Use a versão do seu projeto)

      # --- ★ CORREÇÃO AQUI ★ ---
      
      # 3. Instala dependências do Ubuntu (APENAS para o Pillow)
      - name: Instalar dependências do Ubuntu (Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev

      # 4. Instala o Google Chrome e o Chromedriver (O jeito certo)
      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable # Instala a versão estável mais recente
      
      # --- ★ FIM DA CORREÇÃO ★ ---

      # 5. Instala todas as dependências do Python
      - name: Instalar dependências (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Garante que as libs de teste estão instaladas
          pip install Pillow selenium webdriver-manager

      # 6. Roda os testes do Django
      - name: Rodar testes (Selenium)
        env:
          CI: 'true' # Diz ao tests.py para rodar em modo headless
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python manage.py test

  # =======================================================
  # JOB 2: DEPLOY
  # =======================================================
  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest
    needs: build # <-- Só roda se o 'build' passar
    if: github.ref == 'refs/heads/main' 

    steps:
      - name: 🚀 Disparar deploy automático no Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}